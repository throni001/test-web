<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>From</title>
        <link rel="stylesheet" href="from.css" />
    </head>
    <body>
        <section class="contact-us">
            <h1>Contact Us</h1>
            <form action="">
                <div>
                    <label for="name">Name</label><br />
                    <input type="text" id="innoutt" placeholder="Enter your name here." />
                </div>
                <div>
                    <label for="email">Email Address</label><br />
                    <input
                        type="email"
                        placeholder="Enter you E-mail address here."
                    /> <br>
                    <small>
                        We will never share your details with anyone.
                    </small>
                </div>
                <div>
                    <label for="password">Password</label><br />
                    <input type="password" id="innoutt" placeholder="Enter your password" />
                </div>
                <div>
                    <label for="gender">Gender</label>
                    <input type="radio" value="male" />
                    <label for="male">Male</label>
                    <input type="radio" value="female" />
                    <label for="female">Female</label>
                <div>
                    <label for="city">City</label>
                    <select id="city" name="city">
                        <option value="" selected disabled>Select City</option>
                        <option value="new-york">New York</option>
                        <option value="london">London</option>
                        <option value="tokyo">Tokyo</option>
                        <option value="paris">Paris</option>
                    </select>
                </div>
                <div>
                    <label for="details">Put your short details here</label> <br>
                    <textarea name="details" id="details" rows="4"></textarea>
                </div>
                <div>
                    <label for="file">Upload File</label><br>
                    <input type="file">
                </div>
                <div>
                    <label for="address">Address</label> <br>
                    <textarea name="address" id="address" rows="3"></textarea>
                </div>
                <div>
                    <input type="checkbox">
                    <label for="check">Check me out</label>
                </div>
                <button>
                    Submit
                </button>
            </form>
        </section>
    </body>
</html>
